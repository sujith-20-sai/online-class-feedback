<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Class Feedback Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #ede9fe 100%);
            min-height: 100vh;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .feedback-card {
            background: #ffffff;
            max-width: 650px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* Banner Image Section */
        .banner-container {
            position: relative;
            width: 100%;
            height: 230px;
            overflow: hidden;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.85), transparent);
            padding: 22px;
            color: #ffffff;
        }

        .banner-overlay h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .banner-overlay p {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 4px;
        }

        /* Form Area */
        form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label.question-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }

        .required {
            color: #ef4444;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Pill / Choice Options */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 6px;
        }

        .option-item {
            position: relative;
        }

        .option-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .option-item input[type="radio"]:checked + .option-label {
            background: #4f46e5;
            color: #ffffff;
            border-color: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
        }

        .option-item:hover .option-label {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        /* Success Box */
        .success-box {
            display: none;
            text-align: center;
            padding: 40px 25px;
        }

        .success-box .check-icon {
            width: 64px;
            height: 64px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }

        .success-box h3 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 22px;
        }

        .success-box p {
            color: #64748b;
            font-size: 15px;
        }

        .reset-btn {
            margin-top: 24px;
            background: #f1f5f9;
            color: #475569;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="feedback-card">
        <!-- 1. Header Banner Image -->
        <div class="banner-container">
            <img src="https://images.unsplash.com/photo-1588196749597-9ff075ee6b5b?auto=format&fit=crop&w=1000&q=80" 
                 alt="Online Class Learning Banner">
            <div class="banner-overlay">
                <h2>Online Class Feedback</h2>
                <p>Please share your feedback about the online class</p>
            </div>
        </div>

        <!-- 2. Interactive Feedback Form -->
        <form id="feedbackForm" onsubmit="handleFormSubmit(event)">
            <!-- Student Name -->
            <div class="form-group">
                <label class="question-label" for="studentName">Student Name <span class="required">*</span></label>
                <input type="text" id="studentName" placeholder="Enter your full name..." required>
            </div>

            <!-- Subject / Course -->
            <div class="form-group">
                <label class="question-label" for="courseName">Course / Subject <span class="required">*</span></label>
                <input type="text" id="courseName" placeholder="e.g. Web Development, Python, Math..." required>
            </div>

            <!-- Question 1 -->
            <div class="form-group">
                <label class="question-label">1. How was the overall online class? <span class="required">*</span></label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="overall" value="Excellent" required>
                        <span class="option-label">⭐ Excellent</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="overall" value="Good">
                        <span class="option-label">Good</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="overall" value="Average">
                        <span class="option-label">Average</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="overall" value="Poor">
                        <span class="option-label">Poor</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="overall" value="Very Poor">
                        <span class="option-label">Very Poor</span>
                    </label>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="form-group">
                <label class="question-label">2. How clearly did the instructor explain the topics? <span class="required">*</span></label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="instructor" value="Excellent" required>
                        <span class="option-label">Excellent</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="instructor" value="Good">
                        <span class="option-label">Good</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="instructor" value="Average">
                        <span class="option-label">Average</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="instructor" value="Poor">
                        <span class="option-label">Poor</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="instructor" value="Very Poor">
                        <span class="option-label">Very Poor</span>
                    </label>
                </div>
            </div>

            <!-- Question 3 -->
            <div class="form-group">
                <label class="question-label">3. How useful was the class content? <span class="required">*</span></label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="content" value="Excellent" required>
                        <span class="option-label">Excellent</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="content" value="Good">
                        <span class="option-label">Good</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="content" value="Average">
                        <span class="option-label">Average</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="content" value="Poor">
                        <span class="option-label">Poor</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="content" value="Very Poor">
                        <span class="option-label">Very Poor</span>
                    </label>
                </div>
            </div>

            <!-- Question 4 -->
            <div class="form-group">
                <label class="question-label">4. How was the interaction during the class? <span class="required">*</span></label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="interaction" value="Excellent" required>
                        <span class="option-label">Excellent</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="interaction" value="Good">
                        <span class="option-label">Good</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="interaction" value="Average">
                        <span class="option-label">Average</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="interaction" value="Poor">
                        <span class="option-label">Poor</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="interaction" value="Very Poor">
                        <span class="option-label">Very Poor</span>
                    </label>
                </div>
            </div>

            <!-- Question 5 -->
            <div class="form-group">
                <label class="question-label">5. How satisfied are you with the online class? <span class="required">*</span></label>
                <div class="options-grid">
                    <label class="option-item">
                        <input type="radio" name="satisfaction" value="Excellent" required>
                        <span class="option-label">Excellent</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="satisfaction" value="Good">
                        <span class="option-label">Good</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="satisfaction" value="Average">
                        <span class="option-label">Average</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="satisfaction" value="Poor">
                        <span class="option-label">Poor</span>
                    </label>
                    <label class="option-item">
                        <input type="radio" name="satisfaction" value="Very Poor">
                        <span class="option-label">Very Poor</span>
                    </label>
                </div>
            </div>

            <!-- Question 6 -->
            <div class="form-group">
                <label class="question-label" for="comments">6. Any additional comments or suggestions?</label>
                <textarea id="comments" placeholder="Write your feedback or suggestions here..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>

        <!-- Success Confirmation -->
        <div id="successBox" class="success-box">
            <div class="check-icon">✓</div>
            <h3>Thank You!</h3>
            <p id="thankYouMsg">Your feedback has been successfully submitted.</p>
            <button class="reset-btn" onclick="resetForm()">Submit Another Response</button>
        </div>
    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('studentName').value;
            const thankYouMsg = document.getElementById('thankYouMsg');
            
            thankYouMsg.textContent = `Thank you, ${name}! Your feedback has been recorded successfully.`;

            document.getElementById('feedbackForm').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
        }

        function resetForm() {
            document.getElementById('feedbackForm').reset();
            document.getElementById('feedbackForm').style.display = 'block';
            document.getElementById('successBox').style.display = 'none';
        }
    </script>
</body>
</html>
